<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vision Offscreen — Face Detection + Screen Classification</title>
  <!-- Content Security Policy: allow scripts from extension itself and jsdelivr CDN for Transformers.js -->
  <meta http-equiv="Content-Security-Policy"
        content="script-src 'self' https://cdn.jsdelivr.net https://huggingface.co; connect-src https://huggingface.co https://cdn-lfs.huggingface.co https://cdn.jsdelivr.net;">
</head>
<body>
  <!-- Canvas required by face-api.js TinyFaceDetector (TensorFlow.js WebGL backend) -->
  <canvas id="canvas" style="display:none"></canvas>

  <!-- Worker 1: Face Detection (face-api.js) — existing, unchanged -->
  <script src="face-detector-worker.js"></script>

  <!-- Worker 2: Screen Classification (CLIP zero-shot via Transformers.js) -->
  <script type="module" src="screen-classifier-worker.js"></script>
</body>
</html>
