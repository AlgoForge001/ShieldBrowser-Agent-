<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>National Identity & KYC Verification Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .kyc-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .badge {
      background: #1e3a8a;
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    h2 { font-size: 1.4rem; font-weight: 700; }
    p.desc { font-size: 0.875rem; color: var(--muted); margin-top: 4px; }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: var(--text);
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .status-box {
      margin-top: 20px;
      padding: 14px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      color: #34d399;
    }
    .profile-section {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,0.03);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="kyc-card">
    <div class="header">
      <div>
        <span class="badge">Official Portal</span>
        <h2>Citizen KYC Verification</h2>
        <p class="desc">Enter your identity credentials for secure verification</p>
      </div>
    </div>

    <div class="profile-section">
      <img src="test-face.jpg" alt="Citizen Photo" style="width: 72px; height: 72px; border-radius: 8px; object-fit: cover; border: 2px solid #3b82f6;" />
      <div>
        <div style="font-weight: 600; font-size: 0.95rem;">Citizen Profile: Sunita Verma</div>
        <div style="font-size: 0.8rem; color: var(--muted);">Biometric & Photo Identity Verification</div>
      </div>
    </div>

    <form id="kycForm" onsubmit="event.preventDefault(); handleSubmit();">
      <div class="form-group">
        <label for="aadhaar">Aadhaar Card Number</label>
        <input type="text" id="aadhaar" name="aadhaar" placeholder="Enter 12-digit Aadhaar Number" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="pan">PAN Card Number</label>
        <input type="text" id="pan" name="pan" placeholder="ABCDE1234F" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="password">Profile Security PIN / Password</label>
        <input type="password" id="password" name="password" placeholder="Enter PIN or Password" autocomplete="off" />
      </div>

      <button type="submit" id="submitBtn" class="btn">Verify & Submit KYC</button>
    </form>

    <div id="statusBox" class="status-box">
      <strong>Verification Received:</strong>
      <div id="statusDetails" style="margin-top: 6px; font-family: monospace; font-size: 0.8rem;"></div>
    </div>
  </div>

  <script>
    function handleSubmit() {
      const aadhaar = document.getElementById('aadhaar').value;
      const pan = document.getElementById('pan').value;
      const pass = document.getElementById('password').value;

      const details = document.getElementById('statusDetails');
      details.innerHTML = `
        <div>Aadhaar: ${aadhaar ? '•••• ' + aadhaar.slice(-4) + ' (' + aadhaar.length + ' chars)' : '(empty)'}</div>
        <div>PAN: ${pan ? pan : '(empty)'}</div>
        <div>Password: ${pass ? '••••••••' : '(empty)'}</div>
      `;
      document.getElementById('statusBox').style.display = 'block';
    }
  </script>
</body>
</html>
